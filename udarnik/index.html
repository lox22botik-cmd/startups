<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5efe3">
<title>Ударник — ударения для ЕГЭ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d2b53'/%3E%3Ctext x='32' y='46' font-size='38' font-family='Georgia' text-anchor='middle' fill='%23f5efe3'%3EА%3C/text%3E%3Cpath d='M30 10l8-6' stroke='%23e2533f' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root { --paper: #f5efe3; --card: #fffaf0; --ink: #1d2b53; --ink2: #4a557a; --muted: #8a8473; --line: #e4dccb; --red: #e2533f; --green: #2a9d6a; --gold: #e3a32b; --serif: Lora, Georgia, serif; }
* { box-sizing: border-box; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 17px/1.5 'Golos Text', system-ui, sans-serif; min-height: 100vh;
  background-image: linear-gradient(transparent 31px, rgba(29,43,83,.05) 32px); background-size: 100% 32px; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }
header { display: flex; align-items: center; gap: 16px; padding: 24px 0; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo .mark { width: 46px; height: 46px; border-radius: 13px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font: 700 28px var(--serif); position: relative; }
.logo .mark::after { content: ''; position: absolute; top: 4px; left: 22px; width: 10px; height: 4px; background: var(--red); border-radius: 2px; transform: rotate(-35deg); }
.logo b { font: 700 26px var(--serif); }
.logo small { display: block; color: var(--muted); font-size: 14px; }
.hd { margin-left: auto; display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 16px; box-shadow: 0 2px 0 var(--line); }
.hd .ring { width: 46px; height: 46px; }
.hd b { font-size: 22px; font-weight: 800; display: block; line-height: 1.1; }
.hd span { font-size: 13px; color: var(--muted); }
.hd .sep { width: 1px; height: 34px; background: var(--line); margin: 0 6px; }
nav { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
nav button { border: 1px solid var(--line); background: var(--card); padding: 10px 18px; border-radius: 12px; font-weight: 700; color: var(--ink2); box-shadow: 0 2px 0 var(--line); transition: transform .15s; }
nav button:active { transform: translateY(2px); box-shadow: none; }
nav button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); box-shadow: 0 2px 0 #0e1630; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 26px; box-shadow: 0 3px 0 var(--line); animation: in .4s cubic-bezier(.2,.8,.2,1) both; }
@keyframes in { from { opacity: 0; transform: translateY(10px); } }
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 18px; }
.s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.ct { font-weight: 800; font-size: 18px; margin-bottom: 14px; }
.ct span { font-weight: 500; color: var(--muted); font-size: 14px; margin-left: 6px; }

/* тренировка */
.train { text-align: center; padding: 40px 26px 34px; position: relative; overflow: hidden; }
.prog { display: flex; gap: 5px; justify-content: center; margin-bottom: 36px; }
.prog i { width: 26px; height: 7px; border-radius: 4px; background: var(--line); transition: background .3s; }
.prog i.ok { background: var(--green); } .prog i.bad { background: var(--red); } .prog i.cur { background: var(--ink); }
.hint { color: var(--muted); font-size: 15px; margin-bottom: 20px; }
.word { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; font: 600 clamp(44px, 9vw, 82px)/1.1 var(--serif); letter-spacing: .01em; margin-bottom: 26px; min-height: 100px; align-items: flex-end; }
.word span { padding: 0 1px; }
.word button { border: 0; background: none; font: inherit; padding: 0 3px; border-radius: 10px; position: relative; transition: background .15s, color .2s, transform .2s; }
.word button:hover { background: rgba(29,43,83,.07); }
.word button::after { content: ''; position: absolute; left: 20%; right: 20%; bottom: 2px; height: 4px; border-radius: 2px; background: var(--ink); opacity: .14; }
.word button.ok { color: var(--green); transform: translateY(-6px); }
.word button.bad { color: var(--red); text-decoration: line-through; text-decoration-thickness: 4px; }
.word button.right { color: var(--green); transform: translateY(-6px); }
.word button.ok::before, .word button.right::before { content: ''; position: absolute; top: -10px; left: 50%; width: 16px; height: 6px; background: currentColor; border-radius: 3px; transform: translateX(-30%) rotate(-35deg); }
.word.locked button { pointer-events: none; }
.word.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.fb { min-height: 64px; font-size: 18px; }
.fb .good { color: var(--green); font-weight: 800; font-size: 22px; }
.fb .err { color: var(--red); font-weight: 800; }
.fb .memo { font: 600 26px var(--serif); margin-top: 4px; }
.fb .memo u { color: var(--green); text-decoration: none; border-bottom: 4px solid var(--green); }
.fb .tip { color: var(--ink2); font-size: 15px; margin-top: 6px; }
.btn { border: 0; background: var(--ink); color: var(--paper); padding: 14px 26px; border-radius: 14px; font-weight: 800; font-size: 17px; box-shadow: 0 3px 0 #0e1630; transition: transform .1s; }
.btn:active { transform: translateY(3px); box-shadow: none; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.btn.red { background: var(--red); box-shadow: 0 3px 0 #a8382a; }
.btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.kbd { font-size: 13px; color: var(--muted); margin-top: 16px; }
.combo { position: absolute; top: 20px; right: 24px; font-weight: 800; color: var(--gold); font-size: 18px; transition: transform .2s; }
.combo.pop { transform: scale(1.4); }

/* итог */
.res-big { font: 700 72px var(--serif); line-height: 1; }
.res-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 18px 0; }
.res-list span { padding: 6px 14px; border-radius: 10px; font: 600 20px var(--serif); background: #fdeeea; color: var(--red); }
.res-list span.ok { background: #e6f4ee; color: var(--green); }

/* статистика */
.boxes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; align-items: end; height: 170px; }
.boxes div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; font-size: 13px; color: var(--muted); text-align: center; }
.boxes i { width: 100%; border-radius: 10px 10px 4px 4px; min-height: 4px; transition: height .6s cubic-bezier(.2,.8,.2,1); }
.boxes b { color: var(--ink); font-size: 18px; }
.kpi b { font: 700 44px var(--serif); display: block; line-height: 1.1; }
.kpi span { color: var(--muted); font-size: 15px; }
.groups { display: flex; flex-direction: column; gap: 14px; }
.grp { display: grid; grid-template-columns: 150px 1fr 70px; gap: 12px; align-items: center; }
.grp .tr { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; display: flex; }
.grp .tr i { height: 100%; }
.grp b { text-align: right; }
.hard { display: flex; flex-wrap: wrap; gap: 8px; }
.hard span { padding: 6px 12px; border-radius: 10px; background: #fdeeea; font: 600 19px var(--serif); }
.hard small { font: 600 12px 'Golos Text'; color: var(--red); margin-left: 6px; }
.verdict { font-size: 19px; line-height: 1.55; }
.verdict b { color: var(--red); }

/* словарь */
.search { width: 100%; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 18px; outline: none; margin-bottom: 16px; color: var(--ink); }
.search:focus { border-color: var(--ink); }
.dict { columns: 4 200px; column-gap: 24px; }
.dict h4 { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; margin: 14px 0 6px; break-after: avoid; }
.dict div { font: 500 20px/1.7 var(--serif); break-inside: avoid; display: flex; align-items: center; gap: 8px; }
.dict u { text-decoration: none; color: var(--red); font-weight: 700; }
.dict .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

/* экзамен */
.ex-list { display: flex; flex-direction: column; gap: 10px; max-width: 520px; margin: 0 auto 20px; text-align: left; }
.ex-item { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font: 600 26px var(--serif); transition: .15s; }
.ex-item .n { font: 700 15px 'Golos Text'; color: var(--muted); width: 22px; }
.ex-item.sel { border-color: var(--ink); background: #eef0f7; }
.ex-item.ok { border-color: var(--green); background: #e6f4ee; }
.ex-item.miss { border-color: var(--green); border-style: dashed; }
.ex-item.bad { border-color: var(--red); background: #fdeeea; }
.ex-item em { font-style: normal; color: var(--red); }
.ex-item small { margin-left: auto; font: 600 14px 'Golos Text'; }

.chip { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 5px 12px; font-weight: 700; font-size: 15px; color: var(--ink2); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.mini { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 2px 8px; font-size: 11px; font-weight: 700; color: var(--ink2); margin-left: 6px; letter-spacing: 0; text-transform: none; }
.dict .dw { cursor: pointer; border-radius: 8px; }
.dict .dw:hover { background: rgba(29,43,83,.05); }
.dict em { color: var(--gold); font-style: normal; font-size: 16px; }
.bl-bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 0 auto 14px; max-width: 420px; }
.bl-bar i { display: block; height: 100%; background: var(--green); transition: width .1s linear; }
.set { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; font-size: 15px; }
.set > span { color: var(--muted); font-weight: 600; }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; overflow-x: auto; }
.cal i { width: 100%; min-width: 14px; aspect-ratio: 1; border-radius: 4px; background: #ece4d3; }
.cal i.l1 { background: #c5e3d3; } .cal i.l2 { background: #6cbf95; } .cal i.l3 { background: var(--green); }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.ach div { border: 1px dashed var(--line); border-radius: 14px; padding: 12px; opacity: .45; filter: grayscale(1); }
.ach div.on { opacity: 1; filter: none; border-style: solid; background: #fff5df; }
.ach i { font-style: normal; font-size: 26px; display: block; } .ach b { display: block; font-size: 15px; } .ach small { color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 12px 22px; border-radius: 12px; opacity: 0; transition: .3s; pointer-events: none; font-weight: 600; }
.toast.on { opacity: 1; transform: translateX(-50%); }
footer { text-align: center; color: var(--muted); font-size: 14px; margin-top: 30px; }
footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; }
.bank { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.bank button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 0; font-weight: 700; font-size: 15px; color: var(--ink2); }
.bank button.ok { background: #e6f4ee; border-color: var(--green); color: var(--green); }
.bank button.bad { background: #fdeeea; border-color: var(--red); color: var(--red); }
.vars { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.var { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 0 var(--line); }
.var b { font-size: 17px; color: var(--ink); } .var small { color: var(--muted); font-weight: 600; font-size: 14px; }
.var.done { border-color: var(--gold); } .var.full { border-color: var(--green); background: #e6f4ee; }
.ans { font-weight: 700; font-size: 18px; margin: 0 auto 16px; display: flex; gap: 10px; align-items: center; justify-content: center; }
.ans input { width: 120px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); font: inherit; font-size: 22px; letter-spacing: .15em; text-align: center; background: var(--card); color: var(--ink); outline: none; }
.ans input:focus { border-color: var(--ink); }
.rev { display: flex; flex-direction: column; gap: 8px; max-width: 560px; margin: 18px auto; text-align: left; }
.rev > div { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--green); font-size: 15px; }
.rev > div.bad { border-color: var(--red); background: #fdeeea; }
.rev code { font: inherit; font-weight: 800; font-size: 17px; letter-spacing: .08em; }
.rev div div { font: 600 18px var(--serif); margin-top: 4px; }
@media (max-width: 860px) { .s4, .s5, .s6, .s7, .s8 { grid-column: span 12; } .hd { margin-left: 0; width: 100%; justify-content: space-around; } }
@media (max-width: 520px) { .wrap { padding: 0 14px 40px; } .grp { grid-template-columns: 110px 1fr 56px; } .card { padding: 20px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><div class="mark">А</div><div><b>Ударник</b><small>ударения к заданию №4 ЕГЭ по орфоэпическому минимуму ФИПИ</small></div></div>
    <div class="hd" id="hd"></div>

  <main id="app"></main>
  <footer>Прогресс хранится в этом браузере · <button id="exp">Скачать копию</button> · <button id="imp">Загрузить копию</button> · <button id="reset">Сбросить прогресс</button><input type="file" id="impf" accept=".json" hidden></footer>
</div>
<div class="toast" id="toast"></div>

    const ws = []; while (ws.length < 5) ws.push(q.splice(q.findIndex(x => !ws.includes(x)), 1)[0]);
    const nOk = [1, 2, 2, 3, 3, 4][Math.floor(r() * 6)], okSet = new Set(sh([0, 1, 2, 3, 4]).slice(0, nOk));
    out.push(ws.map((x, k) => { if (okSet.has(k)) return { x, shown: x.i, ok: true }; const vs = [...x.w].map((c, j) => VOW.includes(c) && j !== x.i ? j : -1).filter(j => j >= 0); return { x, shown: vs[Math.floor(r() * vs.length)], ok: false }; }));
  }
  return out;
})();
const varList = v => Array.from({ length: VAR_LEN }, (_, i) => (v - 1) * VAR_LEN + i + 1);
function drawBank() {
  const all = Object.values(S.bank), solved = all.length, okN = all.filter(b => b.ok).length, nv = BANK_N / VAR_LEN;
  $('#app').innerHTML = `<div class="grid">
    <div class="card s4 kpi"><b>${solved} / ${BANK_N}</b><span>заданий прорешано</span></div>
    <div class="card s4 kpi"><b>${okN}</b><span>решено на балл${solved ? ' · ' + Math.round(okN / solved * 100) + '%' : ''}</span></div>
    <div class="card s4 kpi"><b>${solved - okN}</b><span>с ошибкой — ждут перерешивания</span></div>
    <div class="card s12"><div class="ct">Варианты <span>${VAR_LEN} заданий подряд, ответы проверяются в конце — как на пробнике</span></div>
      <div class="vars">${Array.from({ length: nv }, (_, i) => { const v = i + 1, r = S.vars[v]; return `<button class="var ${r == null ? '' : r === VAR_LEN ? 'full' : 'done'}" data-var="${v}"><b>Вариант ${v}</b><small>${r == null ? 'не решён' : 'лучший итог: ' + r + ' из ' + VAR_LEN}</small></button>`; }).join('')}</div></div>
    <div class="card s12"><div class="ct">Банк заданий №4 <span>нажми на номер — откроется задание</span></div>
      <div class="btns" style="justify-content:flex-start;margin:0 0 14px"><button class="btn" data-act="bankNext">${solved < BANK_N ? 'Решать нерешённые подряд' : 'Всё решено — пройти заново'}</button>${solved - okN ? `<button class="btn red" data-act="bankRedo">Перерешать ошибки (${solved - okN})</button>` : ''}</div>
      <div class="bank">${BANK.map((_, i) => { const b = S.bank[i + 1]; return `<button class="${b ? (b.ok ? 'ok' : 'bad') : ''}" data-task="${i + 1}">${i + 1}</button>`; }).join('')}</div>
      <div class="hint" style="text-align:left;margin:12px 0 0">Задания в формате ФИПИ, слова из орфоэпического минимума ФИПИ · зелёный — на балл, красный — с ошибкой</div></div></div>`;
}
let P = null;
function startSolve(list, v = null) { if (!list.length) return toast('Нечего решать'); P = { list, v, i: 0, sel: new Set(), done: false, res: [], ans: [] }; drawTask(); }
function drawTask() {
  if (P.i >= P.list.length) return drawSolveEnd();
  const k = P.list[P.i], items = BANK[k - 1], b = S.bank[k], cur = [...P.sel].sort().map(j => j + 1).join('');
  $('#app').innerHTML = `<div class="card train">
    ${P.list.length > 1 ? `<div class="prog">${P.list.map((_, i) => `<i class="${i < P.i ? (P.v ? 'ok' : P.res[i] ? 'ok' : 'bad') : i === P.i ? 'cur' : ''}"></i>`).join('')}</div>` : ''}
    <div class="hint">${P.v ? `Вариант ${P.v} · задание ${P.i + 1} из ${P.list.length}` : `Задание №${k} из ${BANK_N}`}${b && !P.done ? (b.ok ? ' · раньше решено верно' : ' · раньше была ошибка') : ''}</div>
    <div class="hint" style="font-size:17px;color:var(--ink)"><b>4.</b> Укажите все варианты ответов, в которых верно выделена буква, обозначающая ударный гласный звук. Запишите номера ответов.</div>
    ${exItems(items, P.sel, P.done, 'data-px')}
    <div class="ans">Ответ: <input id="pAns" inputmode="numeric" maxlength="5" autocomplete="off" value="${cur}" ${P.done ? 'disabled' : ''}></div>
    ${P.done ? `<div class="fb"><div class="${P.res[P.i] ? 'good' : 'err'}">${P.res[P.i] ? 'Верно — балл!' : `Неверно. Правильный ответ: ${ansOf(items)}`}</div></div>
      <div class="btns"><button class="btn" id="pNext">${P.i + 1 < P.list.length ? 'Дальше →' : 'Готово'}</button><button class="btn ghost" data-act="toBank">К банку</button></div>`
      : `<div class="btns"><button class="btn" id="pCheck">${P.v ? (P.i + 1 < P.list.length ? 'Ответить →' : 'Завершить вариант') : 'Проверить'}</button></div><div class="kbd">нажимай на варианты или вводи цифры · Enter — ${P.v ? 'ответить' : 'проверить'}</div>`}</div>`;
}
function checkTask() {
  const k = P.list[P.i], items = BANK[k - 1], a = [...P.sel].sort().map(j => j + 1).join(''), ok = a === ansOf(items);
  if (P.v && !a && !confirm('Ответ пустой. Пропустить задание?')) return;
  const prev = S.bank[k]; S.bank[k] = { ok: ok ? 1 : 0, a, n: (prev ? prev.n : 0) + 1, d: today() };
  P.res.push(ok); P.ans.push(a); S.exams.push(ok ? 1 : 0);
  items.forEach((it, j) => answer(it.x, it.ok === P.sel.has(j)));
  save(); renderHd();
  if (P.v) nextTask(); else { P.done = true; drawTask(); }
}
function nextTask() { P.i++; P.sel = new Set(); P.done = false; P.list.length === 1 && !P.v ? drawBank() : drawTask(); }
function drawSolveEnd() {
  const ok = P.res.filter(Boolean).length, n = P.res.length, prev = S.vars[P.v];
  if (P.v) { S.vars[P.v] = Math.max(prev ?? 0, ok); save(); }
  const wrong = [];
  $('#app').innerHTML = `<div class="card train"><div class="hint">${P.v ? `Вариант ${P.v} — итог` : 'Серия заданий решена'}</div><div class="res-big">${ok} / ${n}</div>
    <div class="hint" style="margin-top:8px">${ok === n ? 'Все задания на балл 🎉' : P.v && prev != null && ok > prev ? `Лучше, чем в прошлый раз (было ${prev}) 💪` : 'Ниже разбор — слова с ошибками уже добавлены в тренировку'}</div>
    <div class="rev">${P.list.map((k, i) => { const items = BANK[k - 1], mine = P.ans[i]; if (!P.res[i]) items.forEach((it, j) => { if (it.ok !== mine.includes(j + 1)) wrong.push(it.x); });
      return `<div class="${P.res[i] ? '' : 'bad'}"><b>№${k}</b> · твой ответ: <code>${mine || '—'}</code> · верный: <code>${ansOf(items)}</code>${P.res[i] ? ' ✓' : `<div>${items.filter((it, j) => it.ok !== mine.includes(j + 1)).map(it => stressed(it.x, 'b')).join(', ')}</div>`}</div>`; }).join('')}</div>
    <div class="btns">${wrong.length ? `<button class="btn red" data-act="pWrong">Потренировать эти слова (${wrong.length})</button>` : ''}${P.v && P.v < BANK_N / VAR_LEN ? `<button class="btn" data-var="${P.v + 1}">Вариант ${P.v + 1} →</button>` : ''}<button class="btn ghost" data-act="toBank">К банку</button></div></div>`;
  P.wrong = wrong;
}

// ---------- прогресс ----------
function drawStats() {
  const boxes = [0, 1, 2, 3, 4, 5].map(b => LIST.filter(x => S.cards[x.raw] && card(x.raw).box === b).length);
  const fresh = LIST.filter(x => !S.cards[x.raw]).length, mx = Math.max(fresh, ...boxes) || 1;
  const hard = LIST.filter(x => card(x.raw).err).sort((a, b) => card(b.raw).err - card(a.raw).err).slice(0, 16);
  const days = Object.values(S.days), total = days.reduce((s, d) => s + d.n, 0), okAll = days.reduce((s, d) => s + d.ok, 0);
  const groups = Object.keys(WORDS).map(g => { const ws = LIST.filter(x => x.g === g); return { g, n: ws.length, l: ws.filter(x => card(x.raw).box >= 4).length, s: ws.filter(x => S.cards[x.raw] && card(x.raw).box < 4).length }; });
  const worstG = groups.filter(g => g.s + g.l).sort((a, b) => a.l / a.n - b.l / b.n)[0];
  const due = dueList().length, l = learned();
  const ex = S.exams.slice(-20), exP = ex.length ? Math.round(ex.filter(Boolean).length / ex.length * 100) : null;
  $('#app').innerHTML = `<div class="grid">
    <div class="card s4 kpi"><b>${l}</b><span>из ${LIST.length} слов выучено (знал с первого раза или закрепил повторами)</span></div>
    <div class="card s4 kpi"><b>${total ? Math.round(okAll / total * 100) + '%' : '—'}</b><span>верных ответов за всё время · ${total} ${plural(total, 'ответ', 'ответа', 'ответов')}</span></div>
    <div class="card s4 kpi"><b>${exP == null ? '—' : exP + '%'}</b><span>заданий «как на ЕГЭ» с баллом${ex.length ? ' (последние ' + ex.length + ')' : ' — попробуй вкладку «Как на ЕГЭ»'}</span></div>
    <div class="card s12 verdict">${!total ? 'Начни с тренировки на 15 слов — после неё здесь появится разбор: какие слова путаешь и сколько осталось до полного минимума.' :
      `Выучено <b style="color:var(--green)">${l} из ${LIST.length}</b> слов. ${due ? `Сегодня на повторение ждут <b>${due}</b> ${plural(due, 'слово', 'слова', 'слов')} — это главное, иначе они забудутся.` : 'Все повторы на сегодня сделаны.'} ${worstG ? `Слабее всего — <b>${worstG.g.toLowerCase()}</b> (${worstG.l} из ${worstG.n}).` : ''} ${l < LIST.length ? `При 15 новых словах в день весь минимум пройдёшь примерно за ${Math.ceil(fresh / 15) || 1} ${plural(Math.ceil(fresh / 15) || 1, 'день', 'дня', 'дней')}.` : 'Весь минимум выучен — держи повторами 🎉'}`}</div>
    <div class="card s7"><div class="ct">Коробки повторения <span>чем правее, тем прочнее слово в памяти</span></div>
      <div class="boxes">${[['Не начаты', fresh, '#d9d0bd'], ...boxes.map((n, b) => [b === 0 ? 'Ошибка' : b === 5 ? 'Навсегда' : 'Уровень ' + b, n, ['#e2533f', '#e3a32b', '#d6b83a', '#8fbf5a', '#2a9d6a', '#1d2b53'][b]])].map(([t, n, c]) => `<div><b>${n}</b><i style="height:${n / mx * 100}%;background:${c}"></i>${t}</div>`).join('')}</div></div>
    <div class="card s5"><div class="ct">По частям речи</div><div class="groups">${groups.map(g => `<div class="grp"><span>${g.g}</span><div class="tr"><i style="width:${g.l / g.n * 100}%;background:${GROUP_COLORS[g.g]}"></i><i style="width:${g.s / g.n * 100}%;background:${GROUP_COLORS[g.g]};opacity:.3"></i></div><b>${g.l}/${g.n}</b></div>`).join('')}</div></div>
    <div class="card s12"><div class="ct">Слова-ловушки <span>в которых ты ошибался чаще всего</span></div>${hard.length ? `<div class="hard">${hard.map(x => `<span>${stressed(x, 'b')}<small>×${card(x.raw).err}</small></span>`).join('')}</div><div class="btns" style="justify-content:flex-start;margin-top:16px"><button class="btn red" data-act="hard">Прогнать только ловушки</button></div>` : '<div style="color:var(--muted)">Ошибок пока нет</div>'}</div>
    <div class="card s8"><div class="ct">Календарь занятий <span>${Object.keys(S.days).length} ${plural(Object.keys(S.days).length, 'день', 'дня', 'дней')} с тренировкой · лучшая серия ${bestStreak()}</span></div>${calendar()}</div>
    <div class="card s4"><div class="ct">Настройки</div>
      <div class="set"><span>Слов за тренировку</span><div>${sizeSeg()}</div></div>
      <div class="set"><span>Цель ответов в день</span><div>${[20, 40, 60, 100].map(n => `<button class="chip ${S.goal === n ? 'on' : ''}" data-goal="${n}">${n}</button>`).join(' ')}</div></div>
      <div class="set"><span>Дней до ЕГЭ</span><div><b>${daysToExam()}</b> — ${daysToExam() > Math.ceil(fresh / S.size) + 16 ? 'успеваешь с запасом' : 'пора ускоряться: подними число слов'}</div></div></div>
    <div class="card s12"><div class="ct">Достижения <span>${Object.keys(S.ach).length} из ${ACH.length}</span></div><div class="ach">${ACH.map(([id, ic, t]) => `<div class="${S.ach[id] ? 'on' : ''}"><i>${ic}</i><b>${t}</b><small>${S.ach[id] ? new Date(S.ach[id] + 'T12:00').toLocaleDateString('ru') : 'ещё впереди'}</small></div>`).join('')}</div></div>
  </div>`;
}
// русский язык ЕГЭ — обычно конец мая/начало июня; берём 1 июня ближайшего года
function daysToExam() { const t = new Date(today()), y = t.getMonth() > 5 ? t.getFullYear() + 1 : t.getFullYear(); return Math.max(0, Math.round((new Date(y + '-06-01') - t) / 864e5)); }
function calendar() {
  const end = today(), start = addD(end, -7 * 17 - ((new Date(end + 'T12:00').getDay() + 6) % 7));
  let h = '', d = start;
  while (d <= end) { const x = S.days[d], lv = !x ? 0 : x.n >= S.goal ? 3 : x.n >= S.goal / 2 ? 2 : 1; h += `<i class="l${lv}" title="${new Date(d + 'T12:00').toLocaleDateString('ru')}: ${x ? x.n + ' ответов' : 'нет занятий'}"></i>`; d = addD(d, 1); }
  return `<div class="cal">${h}</div><div class="hint" style="text-align:left;margin:10px 0 0">светлее — меньше половины цели, темнее — цель выполнена</div>`;
}

// ---------- словарь ----------
function drawDict(q = '') {
  const f = q.trim().toLowerCase().replace(/ё/g, 'е');
  const col = x => { const c = S.cards[x.raw]; return !c ? '#d9d0bd' : c.box >= 4 ? '#2a9d6a' : c.box === 0 && c.err ? '#e2533f' : '#e3a32b'; };
  const body = Object.keys(WORDS).map(g => { const ws = LIST.filter(x => x.g === g && (!f || x.w.replace(/ё/g, 'е').includes(f))).sort((a, b) => a.w.localeCompare(b.w, 'ru')); return ws.length ? `<h4>${g} <button class="mini" data-grp="${g}">тренировать</button></h4>${ws.map(x => `<div class="dw" data-star="${x.raw}" title="${memo(x)}"><i class="dot" style="background:${col(x)}"></i>${stressed(x)}${S.star[x.raw] ? '<em>★</em>' : ''}</div>`).join('')}` : ''; }).join('');
  const ns = Object.keys(S.star).length;
  if (!$('#dq')) $('#app').innerHTML = `<div class="card"><input class="search" id="dq" placeholder="Найти слово… (${LIST.length} в минимуме)" autocomplete="off"><div class="hint" style="text-align:left">● выучено &nbsp; ● в процессе &nbsp; ● последняя попытка с ошибкой &nbsp; ● не начато &nbsp;·&nbsp; нажми на слово — ★ в «мой список»</div><div id="stb"></div><div class="dict" id="dl"></div></div>`;
  $('#stb').innerHTML = ns ? `<div class="btns" style="justify-content:flex-start;margin:0 0 8px"><button class="btn" data-act="starTrain">Тренировать мой список (${ns})</button><button class="btn ghost" data-act="starClear">Очистить список</button></div>` : '';
  $('#dl').innerHTML = body || '<div style="color:var(--muted)">Такого слова в минимуме нет</div>';
}
function goTrain(q) { S.view = 'train'; save(); $$('#nav button').forEach(x => x.classList.toggle('on', x.dataset.v === 'train')); startTrain(shuffle(q)); }

// ---------- навигация ----------
function render() {
  const v = S.view || 'train';
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (B) { clearInterval(B.tm); B.done = true; }
  if (v === 'train') startTrain(); if (v === 'exam') startExam(); if (v === 'bank') drawBank(); if (v === 'blitz') drawBlitzStart(); if (v === 'stats') drawStats(); if (v === 'dict') { $('#app').innerHTML = ''; drawDict(); }
  renderHd();
}
$('#nav').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { S.view = b.dataset.v; save(); render(); } };
$('#app').addEventListener('click', e => {
  const st = e.target.closest('[data-star]');
  if (st) { const w = st.dataset.star; S.star[w] ? delete S.star[w] : S.star[w] = 1; save(); drawDict($('#dq').value); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.i != null) pick(+b.dataset.i);
  if (b.dataset.b != null) blitzPick(+b.dataset.b);
  if (b.id === 'nextBtn') next();
  if (b.dataset.act === 'again') startTrain();
  if (b.dataset.act === 'redo') startTrain(shuffle(T.wrong));
  if (b.dataset.size) { S.size = +b.dataset.size; save(); S.view === 'stats' ? drawStats() : drawResult(); }
  if (b.dataset.goal) { S.goal = +b.dataset.goal; save(); drawStats(); renderHd(); }
  if (b.dataset.act === 'blitzGo') blitzGo();
  if (b.dataset.act === 'blitzWrong') goTrain(B.wrong.filter((x, i, a) => a.indexOf(x) === i));
  if (b.dataset.grp) goTrain(LIST.filter(x => x.g === b.dataset.grp).sort((a, c) => card(a.raw).box - card(c.raw).box).slice(0, 25));
  if (b.dataset.act === 'starTrain') goTrain(LIST.filter(x => S.star[x.raw]));
  if (b.dataset.act === 'starClear' && confirm('Очистить мой список?')) { S.star = {}; save(); drawDict($('#dq').value); }
  if (b.dataset.act === 'hard') goTrain(LIST.filter(x => card(x.raw).err).sort((a, b) => card(b.raw).err - card(a.raw).err).slice(0, 15));
  if (b.dataset.ex != null && !E.done) { const k = +b.dataset.ex; E.sel.has(k) ? E.sel.delete(k) : E.sel.add(k); drawExam(); }
  if (b.dataset.act === 'check') checkExam();
  if (b.dataset.act === 'exam') startExam();
  if (b.dataset.task) startSolve([+b.dataset.task]);
  if (b.dataset.var) startSolve(varList(+b.dataset.var), +b.dataset.var);
  if (b.dataset.act === 'bankNext') { const u = BANK.map((_, i) => i + 1).filter(k => !S.bank[k]); startSolve(u.length ? u : BANK.map((_, i) => i + 1)); }
  if (b.dataset.act === 'bankRedo') startSolve(Object.keys(S.bank).filter(k => !S.bank[k].ok).map(Number).sort((a, c) => a - c));
  if (b.dataset.act === 'toBank') { S.view = 'bank'; save(); render(); }
  if (b.dataset.act === 'pWrong') goTrain(P.wrong.filter((x, i, a) => a.indexOf(x) === i));
  if (b.dataset.px != null && P && !P.done) { const k = +b.dataset.px; P.sel.has(k) ? P.sel.delete(k) : P.sel.add(k); drawTask(); }
  if (b.id === 'pCheck') checkTask();
  if (b.id === 'pNext') nextTask();
});
$('#app').addEventListener('input', e => {
  if (e.target.id === 'dq') drawDict(e.target.value);
  if (e.target.id === 'pAns' && P && !P.done) { P.sel = new Set([...e.target.value].filter(c => c >= '1' && c <= '5').map(c => c - 1)); $$('[data-px]').forEach(el => el.classList.toggle('sel', P.sel.has(+el.dataset.px))); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && $('#nextBtn')) { e.preventDefault(); next(); }
  if (e.key === 'Enter' && $('#pCheck')) { e.preventDefault(); checkTask(); return; }
  if (e.key === 'Enter' && $('#pNext')) { e.preventDefault(); nextTask(); return; }
  if (/^[1-5]$/.test(e.key) && $('#pCheck') && document.activeElement.id !== 'pAns') { const k = +e.key - 1; P.sel.has(k) ? P.sel.delete(k) : P.sel.add(k); drawTask(); return; }
  if (/^[1-9]$/.test(e.key) && $('#word') && !$('#word').classList.contains('locked')) { const b = $$('#word button')[+e.key - 1]; if (!b) return; if (b.dataset.b != null) blitzPick(+b.dataset.b); else if (T && !T.locked) pick(+b.dataset.i); }
});
$('#reset').onclick = () => { if (confirm('Сбросить весь прогресс?')) { S = norm(fresh0()); save(); render(); toast('Прогресс сброшен'); } };
$('#exp').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = `udarnik-${today()}.json`; a.click(); toast('Копия скачана'); };
$('#imp').onclick = () => $('#impf').click();
$('#impf').onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { const s = JSON.parse(t); if (!s.cards) throw 0; S = norm(s); save(); render(); toast('Прогресс загружен'); } catch (er) { toast('Это не файл Ударника'); } }); e.target.value = ''; };
render();
</script>
</body>
</html>
