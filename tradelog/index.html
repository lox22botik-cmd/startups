<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0e13">
<title>TradeLog — дневник сделок</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e13'/%3E%3Cpath d='M10 44l12-12 9 8 21-22' stroke='%232fd58b' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e13; --panel: #111821; --panel2: #16202b; --line: #213040; --text: #e8eef5; --muted: #8597ab;
  --up: #2fd58b; --down: #ff5c6c; --gold: #ffb547; --blue: #5aa9ff;
  --mono: 'JetBrains Mono', monospace; --r: 16px;
}
* { box-sizing: border-box; margin: 0; }
html { color-scheme: dark; }
body { background: var(--bg); color: var(--text); font: 16px/1.45 Manrope, system-ui, sans-serif; min-height: 100vh;
  background-image: radial-gradient(900px 500px at 85% -10%, rgba(47,213,139,.08), transparent 60%), radial-gradient(700px 400px at -10% 30%, rgba(90,169,255,.06), transparent 60%); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px 60px; }
.mono { font-family: var(--mono); }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }

/* шапка */
header { display: flex; align-items: center; gap: 18px; padding: 22px 0 18px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo svg { width: 42px; height: 42px; }
.logo b { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.logo small { display: block; color: var(--muted); font-size: 13px; font-weight: 500; letter-spacing: 0; }
.hero-detail { margin-left: auto; display: flex; align-items: center; gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 16px; }
.hero-detail .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.hero-detail .val { font-family: var(--mono); font-size: 20px; font-weight: 700; }
.hero-detail svg { width: 120px; height: 36px; }
nav { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 5px; margin-bottom: 22px; overflow-x: auto; }
nav button { border: 0; background: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; color: var(--muted); white-space: nowrap; transition: .2s; }
nav button.on { background: var(--panel2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
nav .add { margin-left: auto; background: var(--up); color: #04150d; }

/* сетка и карточки */
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.ct { font-size: 15px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: baseline; gap: 10px; }
.ct span { font-weight: 500; color: var(--muted); font-size: 13px; }
.kpi .v { font-family: var(--mono); font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
.kpi .l { color: var(--muted); font-size: 14px; }
.kpi .h { font-size: 13px; color: var(--muted); margin-top: 6px; }
.verdict { font-size: 18px; line-height: 1.5; }
.verdict b { color: var(--gold); }
.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.empty h2 { color: var(--text); font-size: 24px; margin-bottom: 8px; }
.empty .btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }

/* бары */
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 130px 1fr 110px; align-items: center; gap: 12px; font-size: 15px; }
.bar .track { height: 12px; background: var(--panel2); border-radius: 6px; position: relative; overflow: hidden; }
.bar .track i { position: absolute; top: 0; bottom: 0; border-radius: 6px; }
.bar .n { font-family: var(--mono); text-align: right; font-weight: 700; }
.bar .sub { font-size: 12px; color: var(--muted); display: block; font-family: Manrope; font-weight: 500; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 150px; }
.wk div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; font-size: 13px; color: var(--muted); }
.wk i { width: 100%; max-width: 46px; border-radius: 8px 8px 3px 3px; min-height: 3px; }
.wk b { font-family: var(--mono); font-size: 12px; color: var(--text); }

/* график капитала */
.eq { width: 100%; height: 260px; display: block; }
.eq text { fill: var(--muted); font: 12px var(--mono); }

/* таблица */
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; font-size: 13px; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 12px 10px; border-bottom: 1px solid rgba(33,48,64,.6); white-space: nowrap; }
.tbl tr.row { cursor: pointer; transition: background .15s; }
.tbl tr.row:hover { background: var(--panel2); }
.tbl .num { font-family: var(--mono); text-align: right; }
.side { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
.side.long { background: rgba(47,213,139,.15); color: var(--up); } .side.short { background: rgba(255,92,108,.15); color: var(--down); }
.tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--panel2); color: var(--muted); margin-right: 4px; }
.tag.bad { background: rgba(255,92,108,.12); color: #ff97a1; }
a.tag { text-decoration: none; color: var(--blue); }
.alert { border-color: var(--down); background: rgba(255,92,108,.08); margin-bottom: 16px; font-size: 17px; }
.pcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.pcal .cd b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
nav { scrollbar-width: none; } nav::-webkit-scrollbar { display: none; }
.pcal .cw { font-size: 13px; color: var(--muted); text-align: center; }
.pcal .cd { min-height: 78px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; gap: 2px; }
.pcal .cd[data-day] { cursor: pointer; } .pcal .cd[data-day]:hover { border-color: var(--muted); }
.pcal .cd span { font: 600 12px var(--mono); color: var(--muted); }
.pcal .cd b { font: 700 14px var(--mono); } .pcal .cd small { font-size: 11px; color: var(--muted); }
.pcal .cd.up b { color: var(--up); } .pcal .cd.down b { color: var(--down); }
.chk { display: flex; flex-direction: column; gap: 8px; }
.chk label { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; font-size: 16px; }
.chk label:has(input:checked) { border-color: var(--up); background: rgba(47,213,139,.07); }
.chk input { width: 18px; height: 18px; accent-color: var(--up); }
.chk .x { margin-left: auto; background: none; border: 0; color: var(--muted); cursor: pointer; }
.ckadd input { margin-top: 8px; width: 100%; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.scroll { overflow-x: auto; }

/* формы */
.btn { border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 800; background: var(--up); color: #04150d; transition: transform .15s, filter .15s; }
.btn:hover { filter: brightness(1.1); } .btn:active { transform: scale(.97); }
.btn.ghost { background: var(--panel2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.btn.danger { background: rgba(255,92,108,.15); color: var(--down); }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font-size: 16px; outline: none; transition: border-color .15s; width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--blue); }
.fg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.fg .w2 { grid-column: span 2; } .fg .w4 { grid-column: span 4; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 8px; font-weight: 800; color: var(--muted); }
.seg button.on.l { background: rgba(47,213,139,.18); color: var(--up); }
.seg button.on.s { background: rgba(255,92,108,.18); color: var(--down); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 600; color: var(--muted); transition: .15s; }
.chip.on { border-color: var(--gold); color: var(--gold); background: rgba(255,181,71,.1); }
.chip.on.badm { border-color: var(--down); color: #ff97a1; background: rgba(255,92,108,.1); }
.preview { display: flex; gap: 22px; flex-wrap: wrap; background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; font-size: 15px; }
.preview b { font-family: var(--mono); font-size: 18px; }

dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 20px; padding: 0; width: min(780px, calc(100vw - 24px)); max-height: calc(100vh - 30px); }
dialog::backdrop { background: rgba(3,6,10,.7); backdrop-filter: blur(4px); }
dialog[open] { animation: pop .25s cubic-bezier(.2,.8,.2,1); }
@keyframes pop { from { opacity: 0; transform: scale(.96) translateY(10px); } }
.dh { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.dh b { font-size: 20px; }
.dh button { border: 0; background: var(--panel2); width: 36px; height: 36px; border-radius: 10px; font-size: 18px; }
.db { padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
.df { display: flex; gap: 10px; padding: 0 22px 22px; flex-wrap: wrap; }
.df .sp { flex: 1; }

/* калькулятор */
.calc-out { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.calc-out div { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.calc-out b { display: block; font-family: var(--mono); font-size: 24px; }
.calc-out span { font-size: 13px; color: var(--muted); }
.tp { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.tp div { display: flex; justify-content: space-between; padding: 10px 14px; background: var(--bg); border-radius: 10px; border: 1px solid var(--line); }
.tp b { font-family: var(--mono); }

.toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: var(--panel2); border: 1px solid var(--line); padding: 12px 20px; border-radius: 12px; opacity: 0; transition: .3s; pointer-events: none; font-weight: 600; z-index: 9; }
.toast.on { opacity: 1; transform: translateX(-50%); }
footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 30px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
footer button { background: none; border: 0; color: var(--muted); text-decoration: underline; }

@media (max-width: 900px) {
  .s3, .s4 { grid-column: span 6; } .s5, .s6, .s7, .s8 { grid-column: span 12; }
  .fg { grid-template-columns: repeat(2, 1fr); } .fg .w4 { grid-column: span 2; }
  .hero-detail { margin-left: 0; width: 100%; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 14px 40px; }
  .s3, .s4 { grid-column: span 12; }
  .bar { grid-template-columns: 90px 1fr 90px; font-size: 14px; }
  nav .add { margin-left: 0; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#111821" stroke="#213040"/><path d="M10 44l12-12 9 8 21-22" stroke="#2fd58b" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><b>TradeLog</b><small>дневник сделок, который показывает, где ты теряешь деньги</small></div>
    </div>
    <div class="hero-detail" id="heroDetail"></div>
  </header>
  <nav id="nav">
    <button data-v="dash" class="on">Обзор</button>
    <button data-v="trades">Сделки</button>
    <button data-v="cal">Календарь</button>
    <button data-v="mist">Ошибки и эмоции</button>
    <button data-v="calc">Калькулятор позиции</button>
    <button class="add" id="addBtn">+ Сделка</button>
  </nav>
  <main id="app"></main>
  <footer>
    <span>Данные хранятся только в этом браузере</span>
    <button id="expBtn">Скачать копию (JSON)</button>
    <button id="csvBtn">Экспорт в CSV</button>
    <button id="impBtn">Загрузить копию</button>
    <input type="file" id="impFile" accept=".json" hidden>
  </footer>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
'use strict';
const KEY = 'tradelog-v1';
const SETUPS = ['Пробой', 'Отскок от уровня', 'Ложный пробой', 'По тренду', 'Контртренд', 'Новости', 'Скальп'];
const EMOS = [['calm', '😌 Спокоен'], ['sure', '💪 Уверен'], ['fomo', '😰 FOMO'], ['revenge', '😤 Отыграться'], ['fear', '😨 Страх'], ['bored', '🥱 От скуки']];
const MISTAKES = ['Без стопа', 'Сдвинул стоп', 'Рано закрыл', 'Вход без сетапа', 'Завышен объём', 'Против тренда', 'Усреднял убыток', 'Не по плану'];
const WD = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const num = v => { const n = parseFloat(String(v).replace(',', '.').replace(/\s/g, '')); return isFinite(n) ? n : null; };
const money = (v, sign = true) => v == null ? '—' : (sign && v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('ru-RU', { maximumFractionDigits: Math.abs(v) < 10 ? 2 : 0 }) + ' $';
const fx = (v, d = 2) => v == null || !isFinite(v) ? '—' : v.toLocaleString('ru-RU', { maximumFractionDigits: d, minimumFractionDigits: 0 });
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : '';
const fdate = d => new Date(d + 'T12:00').toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, k = m % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; };

function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.trades)) return s; } catch (e) { } return { trades: [], deposit: 1000, view: 'dash', calc: {} }; }
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Не удалось сохранить: ' + e.message); } }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2400); }

// ---------- расчёт сделки ----------
function calc(t) {
  const dir = t.side === 'short' ? -1 : 1, closed = t.exit != null && t.exit !== '';
  const pnl = closed ? (t.exit - t.entry) * t.qty * dir - (t.fee || 0) : null;
  const risk = t.stop ? Math.abs(t.entry - t.stop) * t.qty : null;
  return { closed, pnl, risk, R: closed && risk ? pnl / risk : null, pct: closed ? (t.exit / t.entry - 1) * 100 * dir : null };
}
const closedTrades = () => S.trades.filter(t => calc(t).closed).sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));

function stats(list) {
  const c = list.map(t => ({ t, ...calc(t) }));
  const wins = c.filter(x => x.pnl > 0), loss = c.filter(x => x.pnl < 0);
  const total = c.reduce((s, x) => s + x.pnl, 0);
  const gw = wins.reduce((s, x) => s + x.pnl, 0), gl = -loss.reduce((s, x) => s + x.pnl, 0);
  const Rs = c.filter(x => x.R != null).map(x => x.R);
  let eq = 0, peak = 0, dd = 0; const curve = [];
  for (const x of c) { eq += x.pnl; peak = Math.max(peak, eq); dd = Math.min(dd, eq - peak); curve.push({ d: x.t.date, v: eq }); }
  let cur = 0, maxL = 0, maxW = 0, cw = 0;
  for (const x of c) { if (x.pnl < 0) { cur++; cw = 0; maxL = Math.max(maxL, cur); } else if (x.pnl > 0) { cw++; cur = 0; maxW = Math.max(maxW, cw); } }
  return {
    n: c.length, total, wr: c.length ? wins.length / c.length * 100 : null,
    avgW: wins.length ? gw / wins.length : null, avgL: loss.length ? -gl / loss.length : null,
    pf: gl ? gw / gl : wins.length ? Infinity : null, exp: c.length ? total / c.length : null,
    avgR: Rs.length ? Rs.reduce((a, b) => a + b, 0) / Rs.length : null, dd, curve, maxL, maxW,
    best: c.reduce((b, x) => !b || x.pnl > b.pnl ? x : b, null), worst: c.reduce((b, x) => !b || x.pnl < b.pnl ? x : b, null),
  };
}
function groupBy(list, keyFn) {
  const m = new Map();
  for (const t of list) for (const k of [].concat(keyFn(t)).filter(Boolean)) { if (!m.has(k)) m.set(k, []); m.get(k).push(t); }
  return [...m].map(([k, ts]) => ({ k, ...stats(ts) })).sort((a, b) => b.total - a.total);
}

// ---------- мини-графики ----------
function spark(curve, w = 120, h = 36) {
  if (curve.length < 2) return '';
  const vs = [0, ...curve.map(p => p.v)], mn = Math.min(...vs), mx = Math.max(...vs), r = mx - mn || 1;
  const pts = vs.map((v, i) => `${(i / (vs.length - 1) * w).toFixed(1)},${(h - 3 - (v - mn) / r * (h - 6)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${vs[vs.length - 1] >= 0 ? 'var(--up)' : 'var(--down)'}" stroke-width="2" stroke-linejoin="round"/></svg>`;
}
function equity(curve) {
  const W = 800, H = 260, P = { l: 64, r: 14, t: 16, b: 28 };
  const vs = [0, ...curve.map(p => p.v)], ds = ['', ...curve.map(p => p.d)];
  const mn = Math.min(0, ...vs), mx = Math.max(0, ...vs), r = mx - mn || 1;
  const X = i => P.l + i / Math.max(1, vs.length - 1) * (W - P.l - P.r), Y = v => P.t + (mx - v) / r * (H - P.t - P.b);
  const line = vs.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const last = vs[vs.length - 1], col = last >= 0 ? '#2fd58b' : '#ff5c6c';
  const ticks = [mx, (mx + mn) / 2, mn].map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#213040" stroke-dasharray="3 5"/><text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end">${fx(v, 0)}</text>`).join('');
  const lbl = [1, Math.floor(vs.length / 2), vs.length - 1].filter((v, i, a) => v > 0 && a.indexOf(v) === i).map(i => `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${fdate(ds[i])}</text>`).join('');
  return `<svg class="eq" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    ${ticks}<line x1="${P.l}" x2="${W - P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="#3a4f66"/>
    <polygon points="${X(0)},${Y(0)} ${line} ${X(vs.length - 1)},${Y(0)}" fill="url(#g)"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(vs.length - 1)}" cy="${Y(last)}" r="5" fill="${col}"/>${lbl}</svg>`;
}
function barsHtml(groups, labelFn = k => k) {
  if (!groups.length) return '<div class="muted">Пока нет данных</div>';
  const mx = Math.max(...groups.map(g => Math.abs(g.total))) || 1;
  return `<div class="bars">${groups.map(g => {
    const w = Math.abs(g.total) / mx * 50;
    return `<div class="bar"><span>${esc(labelFn(g.k))}<span class="sub">${g.n} ${plural(g.n, 'сделка', 'сделки', 'сделок')} · ${fx(g.wr, 0)}% в плюс</span></span>
      <div class="track"><i style="left:${g.total >= 0 ? 50 : 50 - w}%;width:${w}%;background:${g.total >= 0 ? 'var(--up)' : 'var(--down)'}"></i><i style="left:50%;width:1px;background:#3a4f66"></i></div>
      <span class="n ${cls(g.total)}">${money(g.total)}</span></div>`;
  }).join('')}</div>`;
}

// ---------- вкладки ----------
const V = {};
V.dash = () => {
  const list = closedTrades(), st = stats(list);
  if (!st.n) return `<div class="card empty"><h2>Дневник пуст</h2><p>Записывай каждую сделку: вход, выход, стоп и что чувствовал.<br>Через 20–30 сделок станет видно, какой сетап кормит, а какая ошибка сливает депозит.</p>

  const bestS = bySetup.filter(g => g.n >= 2 && g.total > 0)[0];
  const lines = [];
  lines.push(`За ${st.n} ${plural(st.n, 'сделку', 'сделки', 'сделок')} ты ${st.total >= 0 ? 'заработал' : 'потерял'} <b>${money(Math.abs(st.total), false)}</b>.`);
  if (st.exp != null) lines.push(`В среднем каждая сделка приносит <b>${money(st.exp)}</b> — ${st.exp > 0 ? 'система в плюс, главное не ломать её' : 'пока система в минус, сокращай объём до исправления ошибок'}.`);
  if (bestS) lines.push(`Лучше всего работает «${esc(bestS.k)}»: <b>${money(bestS.total)}</b>.`);
  if (worstM) lines.push(`Ошибка «${esc(worstM.k)}» стоила <b>${money(worstM.total)}</b> — уберёшь её, и итог станет ${money(st.total - worstM.total)}.`);
  const wd = WD.map((n, i) => ({ n, v: list.filter(t => (new Date(t.date + 'T12:00').getDay() + 6) % 7 === i).reduce((s, t) => s + calc(t).pnl, 0) }));
  const wmx = Math.max(...wd.map(x => Math.abs(x.v))) || 1;
  // распределение R по корзинам
  const rb = [['≤ −2', -1e9, -2], ['−2…−1', -2, -1], ['−1…0', -1, 0], ['0…1', 0, 1], ['1…2', 1, 2], ['2…3', 2, 3], ['≥ 3', 3, 1e9]].map(([n, a, b]) => ({ n, a, v: list.filter(t => { const R = calc(t).R; return R != null && R >= a && R < b; }).length }));
  const rmx = Math.max(...rb.map(x => x.v)) || 1;
  return `${rulesAlert()}<div class="grid">
    <div class="card s3 kpi"><div class="l">Итог</div><div class="v ${cls(st.total)}">${money(st.total)}</div><div class="h">${S.deposit ? fx(st.total / S.deposit * 100, 1) + '% к депозиту ' + fx(S.deposit, 0) + ' $' : ''}</div></div>
    <div class="card s3 kpi"><div class="l">Сделок в плюс</div><div class="v">${fx(st.wr, 0)}%</div><div class="h">${list.filter(t => calc(t).pnl > 0).length} из ${st.n}</div></div>
    <div class="card s3 kpi"><div class="l">Профит-фактор</div><div class="v ${st.pf >= 1 ? 'up' : 'down'}">${st.pf === Infinity ? '∞' : fx(st.pf)}</div><div class="h">прибыль ÷ убытки · норма от 1,5</div></div>
    <div class="card s3 kpi"><div class="l">Средний R</div><div class="v ${cls(st.avgR)}">${st.avgR == null ? '—' : (st.avgR > 0 ? '+' : '') + fx(st.avgR) + 'R'}</div><div class="h">результат в рисках на сделку</div></div>
    <div class="card s8"><div class="ct">Кривая капитала <span>после каждой закрытой сделки</span></div>${equity(st.curve)}</div>
    <div class="card s4"><div class="ct">Вывод</div><div class="verdict">${lines.join(' ')}</div></div>
    <div class="card s6"><div class="ct">Сетапы <span>что кормит, а что сливает</span></div>${barsHtml(bySetup)}</div>
    <div class="card s6"><div class="ct">По дням недели</div><div class="wk">${wd.map(x => `<div><b class="${cls(x.v)}">${x.v ? fx(x.v, 0) : ''}</b><i style="height:${Math.abs(x.v) / wmx * 100}%;background:${x.v >= 0 ? 'var(--up)' : 'var(--down)'};opacity:${x.v ? 1 : .2}"></i>${x.n}</div>`).join('')}</div></div>
    <div class="card s4 kpi"><div class="l">Средняя прибыль / убыток</div><div class="v" style="font-size:22px"><span class="up">${money(st.avgW)}</span> <span class="muted">/</span> <span class="down">${money(st.avgL)}</span></div><div class="h">${st.avgW && st.avgL ? 'прибыль больше убытка в ' + fx(st.avgW / -st.avgL, 1) + ' раза' : ''}</div></div>
    <div class="card s4 kpi"><div class="l">Макс. просадка</div><div class="v down">${money(st.dd)}</div><div class="h">серия убытков подряд: ${st.maxL}, прибылей: ${st.maxW}</div></div>
    <div class="card s4 kpi"><div class="l">Лучшая / худшая</div><div class="v" style="font-size:22px"><span class="up">${money(st.best.pnl)}</span> <span class="muted">/</span> <span class="down">${money(st.worst.pnl)}</span></div><div class="h">${esc(st.best.t.sym)} · ${esc(st.worst.t.sym)}</div></div>
    <div class="card s6"><div class="ct">Распределение R <span>сколько сделок с каким результатом в рисках</span></div><div class="wk">${rb.map(x => `<div><b>${x.v || ''}</b><i style="height:${x.v / rmx * 100}%;background:${x.a < 0 ? 'var(--down)' : 'var(--up)'};opacity:${x.v ? 1 : .2}"></i>${x.n}</div>`).join('')}</div>
      <div class="muted" style="margin-top:10px;font-size:14px">${rb[0].v ? `<span class="down">${rb[0].v} ${plural(rb[0].v, 'сделка', 'сделки', 'сделок')} хуже −2R</span> — стоп не соблюдался. ` : 'Ни одной сделки хуже −2R — стопы соблюдаются. '}${rb[6].v ? `${rb[6].v} ${plural(rb[6].v, 'сделка', 'сделки', 'сделок')} дали 3R+ — такие и делают итог.` : ''}</div></div>
    <div class="card s6"><div class="ct">Лонг / шорт и инструменты</div>${barsHtml(groupBy(list, t => t.side === 'short' ? 'SHORT' : 'LONG'))}<div style="height:14px"></div>${barsHtml(groupBy(list, t => t.sym).slice(0, 6))}</div>

// ---------- правила риска ----------
function todayState() { const td = S.trades.filter(t => t.date === today()); return { n: td.length, pnl: td.filter(t => calc(t).closed).reduce((s, t) => s + calc(t).pnl, 0), lossRow: (() => { let k = 0; for (const t of closedTrades().reverse()) { if (calc(t).pnl < 0) k++; else break; } return k; })() }; }
function rulesBroken() {
  const r = S.rules || {}, s = todayState(), out = [];
  if (r.maxLoss && s.pnl <= -r.maxLoss) out.push(`дневной лимит убытка ${money(-r.maxLoss)} достигнут (сегодня ${money(s.pnl)})`);
  if (r.maxTrades && s.n >= r.maxTrades) out.push(`сегодня уже ${s.n} ${plural(s.n, 'сделка', 'сделки', 'сделок')} при лимите ${r.maxTrades}`);
  if (r.maxRow && s.lossRow >= r.maxRow) out.push(`${s.lossRow} ${plural(s.lossRow, 'убыток', 'убытка', 'убытков')} подряд — правило «${r.maxRow} подряд и пауза»`);
  return out;
}
const rulesAlert = () => { const b = rulesBroken(); return b.length ? `<div class="card alert">⛔ <b>Стоп на сегодня.</b> ${b.join('; ')}. Закрой терминал — дальше обычно идёт «отыгрывание».</div>` : ''; };

// ---------- календарь PnL ----------
V.cal = () => {
  const list = closedTrades(); if (!list.length) return V.dash();
  const m = S.calM || today().slice(0, 7), [y, mo] = m.split('-').map(Number), first = new Date(y, mo - 1, 1), nd = new Date(y, mo, 0).getDate(), off = (first.getDay() + 6) % 7;
  const byDay = {}; list.forEach(t => { (byDay[t.date] = byDay[t.date] || { v: 0, n: 0 }); byDay[t.date].v += calc(t).pnl; byDay[t.date].n++; });
  const mDays = Object.entries(byDay).filter(([d]) => d.startsWith(m)), mx = Math.max(1, ...mDays.map(([, x]) => Math.abs(x.v))), mt = mDays.reduce((s, [, x]) => s + x.v, 0);
  const cells = [...Array(off)].map(() => '<div></div>').concat([...Array(nd)].map((_, i) => { const d = `${m}-${String(i + 1).padStart(2, '0')}`, x = byDay[d]; return `<div class="cd ${x ? cls(x.v) : ''}" style="${x ? `background:${x.v >= 0 ? 'rgba(47,213,139,' : 'rgba(255,92,108,'}${.12 + Math.abs(x.v) / mx * .5})` : ''}" ${x ? `data-day="${d}"` : ''}><span>${i + 1}</span>${x ? `<b>${money(x.v)}</b><small>${x.n} ${plural(x.n, 'сделка', 'сделки', 'сделок')}</small>` : ''}</div>`; }));
  const months = [...new Set(list.map(t => t.date.slice(0, 7)))].sort().reverse().map(k => ({ k, ...stats(list.filter(t => t.date.startsWith(k))) }));
  const green = mDays.filter(([, x]) => x.v > 0).length;
  return `<div class="grid"><div class="card s8"><div class="ct"><button class="btn ghost sm" data-cm="-1">←</button> ${first.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' })} <button class="btn ghost sm" data-cm="1">→</button><span>итог <b class="${cls(mt)}">${money(mt)}</b> · ${green} из ${mDays.length} ${plural(mDays.length, 'дня', 'дней', 'дней')} в плюс</span></div>
    <div class="pcal">${WD.map(w => `<div class="cw">${w}</div>`).join('')}${cells.join('')}</div></div>
    <div class="card s4"><div class="ct">По месяцам</div><table class="tbl"><thead><tr><th>Месяц</th><th class="num">Сделок</th><th class="num">В плюс</th><th class="num">Итог</th></tr></thead><tbody>${months.map(x => `<tr class="row" data-mk="${x.k}"><td>${new Date(x.k + '-15').toLocaleDateString('ru-RU', { month: 'short', year: '2-digit' })}</td><td class="num">${x.n}</td><td class="num">${fx(x.wr, 0)}%</td><td class="num ${cls(x.total)}"><b>${money(x.total)}</b></td></tr>`).join('')}</tbody></table></div></div>`;
};

V.trades = () => {

      <td class="num ${cls(c.R)}">${c.R != null ? (c.R > 0 ? '+' : '') + fx(c.R, 1) : '—'}</td>
      <td>${t.setup ? `<span class="tag">${esc(t.setup)}</span>` : ''}${t.emo ? `<span class="tag">${EMOS.find(e => e[0] === t.emo)?.[1] || ''}</span>` : ''}${(t.mist || []).map(m => `<span class="tag bad">${esc(m)}</span>`).join('')}${t.link ? `<a class="tag" href="${esc(t.link)}" target="_blank" rel="noopener" title="Скрин графика">🔗 график</a>` : ''}${t.note ? `<span class="tag" title="${esc(t.note)}">📝</span>` : ''}</td></tr>`; }).join('')}
    </tbody></table></div></div>`;
};

V.mist = () => {

    <div class="card s12 verdict">${sd.n && sc.n ? `Без ошибок ты зарабатываешь в среднем <b>${money(sc.exp)}</b> на сделку, с ошибками — <b>${money(sd.exp)}</b>. ${sc.exp > sd.exp ? 'Дисциплина буквально стоит денег: перед входом проверь список ошибок.' : 'Странно, но ошибки пока не вредят — скорее всего, просто мало сделок.'}` : 'Отмечай ошибки в каждой сделке — здесь появится, сколько стоит каждая.'}</div>

};
const DEF_CHECK = ['Сетап из моего списка, а не «кажется, полетит»', 'Стоп определён до входа', 'Риск не больше 1% депозита', 'Не отыгрываюсь после убытка', 'Цель минимум 2R'];
function calcUpdate(e) {
  if (e && e.target.closest && (e.target.closest('.chk') || e.target.id === 'ckNew' || /^r(Dep|Loss|Tr|Row)$/.test(e.target.id))) return;
  const c = S.calc = { dep: num($('#cDep').value), risk: num($('#cRisk').value), entry: num($('#cEntry').value), stop: num($('#cStop').value), lev: +$('#cLev').value, side: $('#cSide .on')?.dataset.s || 'long' };
  $('#cLevV').textContent = '×' + c.lev; save();

  if (!c.dep || !c.risk || !c.entry || !c.stop) { out.innerHTML = '<div class="ct">Результат</div><div class="muted">Впиши депозит, риск, вход и стоп — посчитаю объём, маржу и цели.</div>'; return; }
  const wrong = c.side === 'long' ? c.stop >= c.entry : c.stop <= c.entry;
  if (wrong) { out.innerHTML = `<div class="ct">Результат</div><div class="down">Для ${c.side === 'long' ? 'лонга стоп должен быть ниже' : 'шорта стоп должен быть выше'} входа.</div>`; return; }
  const riskUsd = c.dep * c.risk / 100, dist = Math.abs(c.entry - c.stop), qty = riskUsd / dist, pos = qty * c.entry, margin = pos / c.lev;
  const dir = c.side === 'long' ? 1 : -1, liq = c.entry * (1 - dir / c.lev);
  const liqBad = c.side === 'long' ? liq >= c.stop : liq <= c.stop;
  out.innerHTML = `<div class="ct">Результат</div>
    <div class="calc-out">
      <div><b>${fx(qty, qty < 1 ? 5 : 2)}</b><span>количество (монет / акций)</span></div>
      <div><b>${fx(pos, 0)} $</b><span>размер позиции</span></div>
      <div><b class="down">−${fx(riskUsd, 2)} $</b><span>потеря, если выбьет стоп (${fx(dist / c.entry * 100)}% до стопа)</span></div>
      <div><b class="${margin > c.dep ? 'down' : ''}">${fx(margin, 0)} $</b><span>нужно маржи при ×${c.lev}${margin > c.dep ? ' — больше депозита!' : ''}</span></div>
    </div>
    <div class="tp">${[1.5, 2, 3].map(r => `<div><span>Цель ${fx(r, 1)}R — прибыль <b class="up">+${fx(riskUsd * r, 2)} $</b></span><b>${fx(c.entry + dir * dist * r, 6)}</b></div>`).join('')}</div>
    <p class="muted" style="margin-top:12px;font-size:14px">Примерная ликвидация при ×${c.lev}: <b class="mono ${liqBad ? 'down' : ''}">${fx(liq, 6)}</b>${liqBad ? ' — <span class="down">раньше стопа! Уменьши плечо.</span>' : ' — дальше стопа, ок.'}</p>`;
}

// ---------- форма сделки ----------
function tradeForm(t) {
  const isNew = !t; t = t || { date: today(), side: 'long', sym: S.lastSym || '', entry: '', exit: '', stop: '', qty: '', fee: '', setup: '', emo: '', mist: [], note: '' };
  const d = $('#dlg');
  d.innerHTML = `<div class="dh"><b>${isNew ? 'Новая сделка' : 'Сделка ' + esc(t.sym)}</b><button data-close>✕</button></div>
  <div class="db">
    <div class="fg">
      <label class="f">Дата<input type="date" id="tDate" value="${t.date}"></label>
      <label class="f">Инструмент<input id="tSym" value="${esc(t.sym)}" placeholder="BTCUSDT" list="symList" autocomplete="off"></label>
      <datalist id="symList">${[...new Set(S.trades.map(x => x.sym))].map(s => `<option value="${esc(s)}">`).join('')}</datalist>
      <div class="f w2">Направление<div class="seg" id="tSide"><button class="${t.side !== 'short' ? 'on l' : ''}" data-s="long">LONG ↑</button><button class="${t.side === 'short' ? 'on s' : ''}" data-s="short">SHORT ↓</button></div></div>
      <label class="f">Вход<input id="tEntry" inputmode="decimal" value="${t.entry}"></label>
      <label class="f">Выход <small>(пусто — открыта)</small><input id="tExit" inputmode="decimal" value="${t.exit ?? ''}"></label>
      <label class="f">Стоп<input id="tStop" inputmode="decimal" value="${t.stop ?? ''}"></label>
      <label class="f">Кол-во<input id="tQty" inputmode="decimal" value="${t.qty}" placeholder="монет / акций"></label>
      <label class="f">Комиссия, $<input id="tFee" inputmode="decimal" value="${t.fee ?? ''}" placeholder="0"></label>
      <label class="f w2">Сетап<select id="tSetup"><option value="">— не выбран —</option>${SETUPS.map(s => `<option ${t.setup === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
    </div>
    <div class="preview" id="tPrev"></div>
    <div class="f">Что чувствовал при входе<div class="chips" id="tEmo">${EMOS.map(([k, n]) => `<button class="chip ${t.emo === k ? 'on' : ''}" data-e="${k}">${n}</button>`).join('')}</div></div>
    <div class="f">Ошибки <small>(честно — это самое полезное)</small><div class="chips" id="tMist">${MISTAKES.map(m => `<button class="chip ${(t.mist || []).includes(m) ? 'on badm' : ''}" data-m="${m}">${m}</button>`).join('')}</div></div>
    <label class="f">Заметка<textarea id="tNote" rows="2" placeholder="почему вошёл, что пошло не так">${esc(t.note)}</textarea></label>
    <label class="f">Ссылка на скрин графика <small>(TradingView → «Сделать снимок» → ссылка)</small><input id="tLink" value="${esc(t.link || '')}" placeholder="https://www.tradingview.com/x/..."></label>
  </div>
  <div class="df">${isNew ? '' : '<button class="btn danger" id="tDel">Удалить</button>'}<span class="sp"></span><button class="btn ghost" data-close>Отмена</button><button class="btn" id="tSave">Сохранить</button></div>`;
  d.showModal();
  const read = () => ({ date: $('#tDate').value || today(), sym: $('#tSym').value.trim().toUpperCase(), side: $('#tSide .on').dataset.s, entry: num($('#tEntry').value), exit: num($('#tExit').value), stop: num($('#tStop').value), qty: num($('#tQty').value), fee: num($('#tFee').value) || 0, setup: $('#tSetup').value, emo: $('#tEmo .on')?.dataset.e || '', mist: $$('#tMist .on').map(b => b.dataset.m), note: $('#tNote').value.trim(), link: /^https?:\/\//.test($('#tLink').value.trim()) ? $('#tLink').value.trim() : '' });
  const prev = () => {
    const x = read();
    if (!x.entry || !x.qty) { $('#tPrev').innerHTML = '<span class="muted">Впиши вход и количество — посчитаю результат и R</span>'; return; }
    const c = calc(x);
    $('#tPrev').innerHTML = `<span>Позиция <b>${fx(x.entry * x.qty, 0)} $</b></span>${c.risk ? `<span>Риск <b class="down">${fx(c.risk, 2)} $</b></span>` : '<span class="down">Без стопа риск не посчитать</span>'}${c.closed ? `<span>Результат <b class="${cls(c.pnl)}">${money(c.pnl)}</b></span>${c.R != null ? `<span>R <b class="${cls(c.R)}">${(c.R > 0 ? '+' : '') + fx(c.R, 2)}</b></span>` : ''}` : '<span class="muted">сделка открыта</span>'}`;
  };
  d.oninput = prev; prev();
  d.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.matches('[data-close]')) return d.close();
    if (b.closest('#tSide')) { $$('#tSide button').forEach(x => x.className = ''); b.className = 'on ' + (b.dataset.s === 'long' ? 'l' : 's'); prev(); }
    if (b.dataset.e) { const on = b.classList.contains('on'); $$('#tEmo .chip').forEach(x => x.classList.remove('on')); if (!on) b.classList.add('on'); }
    if (b.dataset.m) { b.classList.toggle('on'); b.classList.toggle('badm'); }
    if (b.id === 'tSave') {
      const x = read();
      if (!x.sym || !x.entry || !x.qty) return toast('Нужны инструмент, вход и количество');
      if (x.stop && (x.side === 'long' ? x.stop >= x.entry : x.stop <= x.entry)) return toast(x.side === 'long' ? 'У лонга стоп ниже входа' : 'У шорта стоп выше входа');
      x.id = isNew ? uid() : t.id; S.lastSym = x.sym;
      S.trades = S.trades.filter(y => y.id !== x.id).concat(x); save(); d.close(); render();
      const br = rulesBroken();
      toast(br.length ? '⛔ Правила нарушены: ' + br[0] : calc(x).closed ? `Записано: ${money(calc(x).pnl)}` : 'Открытая сделка записана');
    }
    if (b.id === 'tDel' && confirm('Удалить сделку?')) { S.trades = S.trades.filter(y => y.id !== t.id); save(); d.close(); render(); }
  };
}

// ---------- пример ----------
function demo() {
  const syms = [['BTCUSDT', 80000, .02], ['ETHUSDT', 2300, .5], ['SOLUSDT', 100, 8], ['SBER', 290, 30]];
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const out = [], d0 = new Date(); d0.setDate(d0.getDate() - 45);
  for (let i = 0; i < 38; i++) {
    const [sym, px, q] = syms[Math.floor(rnd() * syms.length)], side = rnd() > .4 ? 'long' : 'short', dir = side === 'long' ? 1 : -1;
    const entry = +(px * (0.95 + rnd() * .1)).toFixed(2), stopD = entry * (0.008 + rnd() * .012);
    const mist = rnd() > .7 ? [MISTAKES[Math.floor(rnd() * MISTAKES.length)]] : [];
    const emo = mist.length ? ['fomo', 'revenge', 'fear', 'bored'][Math.floor(rnd() * 4)] : ['calm', 'sure'][Math.floor(rnd() * 2)];
    const r = mist.length ? (rnd() > .65 ? rnd() * 1.5 : -(0.8 + rnd() * 1.4)) : (rnd() > .45 ? 0.8 + rnd() * 2.4 : -1);
    const d = new Date(d0); d.setDate(d.getDate() + Math.floor(i * 45 / 38));
    out.push({ id: 'demo' + i, date: d.toISOString().slice(0, 10), sym, side, entry, stop: +(entry - dir * stopD).toFixed(2), exit: +(entry + dir * stopD * r).toFixed(2), qty: q, fee: +(entry * q * 0.0008).toFixed(2), setup: SETUPS[Math.floor(rnd() * 5)], emo, mist, note: '', demo: true });
  }
  S.trades = out; S.deposit = 1000; save(); render(); toast('Загружен пример — 38 сделок. Очистить можно внизу страницы');
}

// ---------- рендер ----------
function render() {
  const v = V[S.view] ? S.view : 'dash';
  $$('#nav [data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#app').innerHTML = V[v]();
  renderHero();
  if (v === 'calc') { $('#app').oninput = calcUpdate; calcUpdate(); } else $('#app').oninput = null;
  const foot = $('footer');
  if (S.trades.some(t => t.demo) && !$('#clrDemo')) foot.insertAdjacentHTML('beforeend', '<button id="clrDemo">Очистить пример</button>');
  if (!S.trades.some(t => t.demo)) $('#clrDemo')?.remove();
}
$('#nav').onclick = e => { const b = e.target.closest('[data-v]'); if (b) { S.view = b.dataset.v; save(); render(); } };
$('#addBtn').onclick = () => tradeForm();
$('#app').onclick = e => {
  if (e.target.closest('a')) return;
  const b =e.target.closest('[data-act],[data-res],[data-id],#cSide button,[data-cm],[data-day],[data-mk],[data-dayx],[data-ckdel]'); if (!b) return;
  if (b.dataset.cm) { const [y, m] = (S.calM || today().slice(0, 7)).split('-').map(Number), d = new Date(y, m - 1 + +b.dataset.cm, 1); S.calM = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; save(); return render(); }
  if (b.dataset.mk) { S.calM = b.dataset.mk; save(); return render(); }
  if (b.dataset.day) { S.filter = { day: b.dataset.day }; S.view = 'trades'; save(); return render(); }
  if (b.dataset.dayx != null) { S.filter = { ...S.filter, day: '' }; save(); return render(); }
  if (b.dataset.ckdel) { e.preventDefault(); S.check = (S.check || DEF_CHECK).filter((_, i) => i !== +b.dataset.ckdel); save(); return render(); }
  if (b.dataset.act === 'add') tradeForm(); if (b.dataset.act === 'demo') demo();
  if (b.dataset.res != null) { S.filter = { ...S.filter, res: b.dataset.res }; save(); render(); }
  if (b.dataset.id) tradeForm(S.trades.find(t => t.id === b.dataset.id));
  if (b.closest('#cSide')) { $$('#cSide button').forEach(x => x.className = ''); b.className = 'on ' + (b.dataset.s === 'long' ? 'l' : 's'); calcUpdate(); }
};
$('#app').onchange = e => {
  const id = e.target.id;
  if (id === 'fSym') { S.filter = { ...S.filter, sym: e.target.value }; save(); render(); }
  if (/^r(Dep|Loss|Tr|Row)$/.test(id)) { S.deposit = num($('#rDep').value) || S.deposit; S.rules = { maxLoss: num($('#rLoss').value) || 0, maxTrades: num($('#rTr').value) || 0, maxRow: num($('#rRow').value) || 0 }; save(); render(); toast('Правила сохранены'); }
  if (e.target.dataset.ck != null) { const all = $$('.chk input'), n = all.filter(x => x.checked).length; $('#ckRes').innerHTML = n === all.length ? '<b class="up">✓ Все пункты выполнены — можно входить. Объём возьми из калькулятора.</b>' : `Отмечено ${n} из ${all.length}${n ? ' — не входи, пока не выполнены все' : ''}`; }
};
$('#app').addEventListener('submit', e => { if (e.target.id !== 'ckAdd') return; e.preventDefault(); const v = $('#ckNew').value.trim(); if (!v) return; S.check = (S.check || DEF_CHECK).concat(v); save(); render(); });
document.addEventListener('click', e => { if (e.target.id === 'clrDemo') { S.trades = S.trades.filter(t => !t.demo); save(); render(); toast('Пример удалён'); } });
$('#expBtn').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' })); a.download = 'tradelog-' + today() + '.json'; a.click(); };
$('#csvBtn').onclick = () => {
  const rows = [['Дата', 'Инструмент', 'Направление', 'Вход', 'Выход', 'Стоп', 'Кол-во', 'Комиссия', 'Результат $', 'R', 'Сетап', 'Эмоция', 'Ошибки', 'Заметка']].concat(S.trades.map(t => { const c = calc(t); return [t.date, t.sym, t.side, t.entry, t.exit ?? '', t.stop ?? '', t.qty, t.fee, c.pnl == null ? '' : c.pnl.toFixed(2), c.R == null ? '' : c.R.toFixed(2), t.setup, t.emo, (t.mist || []).join('; '), t.note]; }));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\n')], { type: 'text/csv' })); a.download = 'tradelog-' + today() + '.csv'; a.click();
};
$('#impBtn').onclick = () => $('#impFile').click();
$('#impFile').onchange = async e => { try { const s = JSON.parse(await e.target.files[0].text()); if (!Array.isArray(s.trades)) throw 0; S = s; save(); render(); toast('Загружено сделок: ' + s.trades.length); } catch (er) { toast('Это не файл TradeLog'); } };
render();
</script>
